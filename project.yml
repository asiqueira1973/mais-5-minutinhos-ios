# project.yml — fonte de verdade do projeto Xcode (gerado via `xcodegen generate`).
# O .xcodeproj é derivado deste arquivo e não é versionado (spec seção 4/18).
# App "Mais 5 Minutinhos": despertador de cabeceira com AlarmKit, 100% local (spec 0).
#
# Codinome técnico dos targets: "MaisCincoMinutinhos".
name: MaisCincoMinutinhos

options:
  bundleIdPrefix: com.dablab              # mesmo prefixo dos apps publicados (spec 4)
  deploymentTarget:
    iOS: "26.0"                           # AlarmKit não existe antes (spec 4, assunção 24.1)
  developmentLanguage: pt-BR              # idioma único do MVP (spec 17)
  createIntermediateGroups: true

settings:
  base:
    DEVELOPMENT_TEAM: XGZW6Y6K25          # mesmo Apple Developer Team do portfólio (spec 4)
    SWIFT_VERSION: "6.0"                  # Swift 6 (spec 4)
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "3"
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1"           # somente iPhone (spec 3/17)
    SUPPORTS_MACCATALYST: NO

targets:
  # ---------------------------------------------------------------------------
  # App principal (SwiftUI). Neste momento contém só o app mínimo do spike 8.1.
  # ---------------------------------------------------------------------------
  MaisCincoMinutinhos:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Core
      - path: Features
      - path: Resources
        excludes:
          - "**/LICENSES.md"
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: "5 Minutinhos"   # nome sob o ícone (assunção 24.2)
        CFBundleShortVersionString: $(MARKETING_VERSION)   # "Versão" nos Ajustes (10.6)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSAlarmKitUsageDescription: "O Mais 5 Minutinhos usa alarmes para tocar na hora certa, mesmo com o iPhone no silencioso."  # copy 15.9
        NSSupportsLiveActivities: true        # Live Activity da soneca (spec 4)
        ITSAppUsesNonExemptEncryption: false  # só HTTPS/StoreKit da Apple; sem criptografia própria (App Encryption Documentation)
        UILaunchScreen:
          UIColorName: LaunchBackground       # preto: abertura sem clarão à noite (princípio 0.3)
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown   # exigido pelo Xcode 26; ignorado em iPhone com Face ID
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIStatusBarStyle: UIStatusBarStyleLightContent
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dablab.mais5minutinhos
        TARGETED_DEVICE_FAMILY: "1"   # só iPhone (spec 3/17); no nível do target, senão o XcodeGen aplica "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon   # ícone A do design (LED "05"), scripts/make-app-icon.swift
    dependencies:
      - target: MaisCincoMinutinhosWidget

  # ---------------------------------------------------------------------------
  # Widget extension: Live Activity da contagem da soneca (spec 4, 8.6, 10.9).
  # Compartilha com o app só o metadata e o intent de parar (Core/Alarm).
  # ---------------------------------------------------------------------------
  MaisCincoMinutinhosWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: Widget
      - path: Core/Alarm/Mais5Metadata.swift
      - path: Core/Alarm/StopAlarmIntent.swift
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: "5 Minutinhos"
        CFBundleShortVersionString: $(MARKETING_VERSION)   # a extensão precisa ter a mesma versão do app
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dablab.mais5minutinhos.widget
        TARGETED_DEVICE_FAMILY: "1"   # só iPhone (spec 3/17)

  # ---------------------------------------------------------------------------
  # Testes unitários (seção 22): persistência, regras de agendamento e cálculo.
  # AlarmKit não é testado aqui; só em aparelho físico (seção 22).
  # ---------------------------------------------------------------------------
  MaisCincoMinutinhosTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
      # Configuração StoreKit local usada pelos testes da compra (8.8).
      - path: MaisCincoMinutinhos.storekit
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dablab.mais5minutinhos.tests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: MaisCincoMinutinhos

schemes:
  MaisCincoMinutinhos:
    build:
      targets:
        MaisCincoMinutinhos: all
        MaisCincoMinutinhosTests: [test]
    run:
      config: Debug
      # StoreKit local para testar compra/restauração/reembolso no simulador (8.8).
      storeKitConfiguration: MaisCincoMinutinhos.storekit
    test:
      config: Debug
      targets:
        - MaisCincoMinutinhosTests
